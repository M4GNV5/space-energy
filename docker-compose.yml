version: "3.8"

services:
  game:
    build: .
    image: space-energy
    restart: unless-stopped
    networks:
      - web
    environment:
      # Only used when no save exists yet; unset means a random world.
      - SEED
    volumes:
      - save:/data
    stop_grace_period: 30s
    cpus: 4
    mem_limit: 8g
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.space-energy.rule=Host(`space-energy.broken.services`)"
      - "traefik.http.routers.space-energy.entrypoints=https"
      - "traefik.http.routers.space-energy.tls=true"
      - "traefik.http.routers.space-energy.tls.certresolver=le"
      - "traefik.http.services.space-energy.loadbalancer.server.port=8080"

volumes:
  save:

networks:
  web:
    external: true
